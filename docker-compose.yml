version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: logistics_postgres
    restart: always
    environment:
      POSTGRES_DB: logistics_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docs/schema.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: logistics_api
    restart: always
    command: uvicorn src.api.main:app --host 0.0.0.0 --port 8000
    environment:
      DATABASE_URL: postgresql://postgres:postgrespassword@db:5432/logistics_db
      RANDOM_SEED: 20261022
      API_HOST: 0.0.0.0
      API_PORT: 8000
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./models:/app/models
      - ./reports:/app/reports
    depends_on:
      db:
        condition: service_healthy

  dashboard:
    build: .
    container_name: logistics_dashboard
    restart: always
    command: streamlit run dashboard/app.py --server.port=8501 --server.address=0.0.0.0
    environment:
      API_URL: http://api:8000
      DATABASE_URL: postgresql://postgres:postgrespassword@db:5432/logistics_db
    ports:
      - "8501:8501"
    volumes:
      - ./data:/app/data
      - ./models:/app/models
      - ./reports:/app/reports
    depends_on:
      - api

volumes:
  pgdata:
